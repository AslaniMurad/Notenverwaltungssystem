<VirtualHost *:80>
    ServerName nvs.htlwydev.at
    Redirect permanent / https://nvs.htlwydev.at/
</VirtualHost>

<VirtualHost *:443>
    ServerName nvs.htlwydev.at

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/nvs.crt
    SSLCertificateKeyFile /etc/ssl/private/nvs.key

    ProxyPreserveHost On
    RequestHeader unset X-Remote-User

    <Location />
        AuthType GSSAPI
        AuthName "NVS"
        GssapiCredStore keytab:/etc/apache2/nvs.keytab
        GssapiLocalName On
        Require valid-user

        RequestHeader set X-Remote-User expr=%{REMOTE_USER}
    </Location>

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/nvs-error.log
    CustomLog ${APACHE_LOG_DIR}/nvs-access.log combined
</VirtualHost>
